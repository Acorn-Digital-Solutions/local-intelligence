# continue-config.yaml — Continue extension config for the local stack.
# Copy to ~/.continue/config.yaml (see plan §8); Continue reloads it on save.
# Model names must match `ollama list` exactly. All roles run against the
# local Ollama server — no cloud traffic. Schema: https://docs.continue.dev/reference
# From another LAN machine, replace 127.0.0.1 with compute.local (plan §8, path B).
name: Local Config
version: 0.0.1
schema: v1
models:
  # Agent mode default (first chat model = picker default): Meta's 30B
  # agent-tuned model, MLX-accelerated on Apple Silicon. Real tool_calls
  # proven via :11434/v1; also takes image input (vision).
  - name: Muse Glimmer 30B (agentic)
    provider: ollama
    model: muse-glimmer:30b-mlx
    apiBase: http://127.0.0.1:11434
    roles:
      - chat
    capabilities:
      - tool_use
      - image_input
  # Heavyweight agent: OpenAI's 120B open-weights model (~65GB). Slower
  # but strongest reasoning + tool calling; proven via :11434/v1.
  - name: GPT-OSS 120B (heavyweight)
    provider: ollama
    model: gpt-oss:120b
    apiBase: http://127.0.0.1:11434
    roles:
      - chat
    capabilities:
      - tool_use
  # Agentic backup: proven real tool_calls, kept for when the models
  # above are unloaded. Qwen2.5 narrates tool calls as text and must NOT
  # be used in Agent mode.
  - name: Qwen3-Coder 30B (agentic)
    provider: ollama
    model: qwen3-coder:30b
    apiBase: http://127.0.0.1:11434
    roles:
      - chat
    capabilities:
      - tool_use
  # Coding Q&A + inline edits (Cmd+I): proven chat model, no tool use.
  - name: Qwen2.5-Coder 32B
    provider: ollama
    model: qwen2.5-coder:32b
    apiBase: http://127.0.0.1:11434
    roles:
      - chat
      - edit
      - apply
  # Step-by-step reasoning when stuck (verbose, chat only).
  - name: DeepSeek R1 32B (reasoning)
    provider: ollama
    model: deepseek-r1:32b
    apiBase: http://127.0.0.1:11434
    roles:
      - chat
  # Codebase indexing (@codebase): same local embeddings as the RAG stack.
  - name: Nomic Embed Text
    provider: ollama
    model: nomic-embed-text
    apiBase: http://127.0.0.1:11434
    roles:
      - embed
  # Tab autocomplete is deliberately NOT configured: it needs a small,
  # fast model and only 30B+ models are installed (seconds per suggestion).
  # To enable: `ollama pull qwen2.5-coder:1.5b`, then add:
  # - name: Qwen2.5-Coder 1.5B
  #   provider: ollama
  #   model: qwen2.5-coder:1.5b
  #   apiBase: http://127.0.0.1:11434
  #   roles:
  #     - autocomplete
rules:
  # Qwen3-30B invents near-miss tool/argument names that Continue rejects
  # ("Tool ... not found", "Cannot read properties of undefined"). Exact
  # built-in tool names + arguments in Continue 2.0.0 (verified in bundle):
  - "Agent tools - exact names and arguments only: read_file(filepath), read_file_range(filepath, startLine, endLine), create_new_file(filepath, contents), grep_search(query), file_glob_search(pattern), ls(dirPath), run_terminal_command(command), fetch_url_content(url), search_web(query). Lowercase filepath/contents/query - never filePath, fileContent, or pattern for grep. Never invent variants like file_read, run_terminal, run_shell_command, or fetch_url."
# Project Qdrant retrieval (rag_mcp.py). Stdio entry works only on the
# machine hosting the checkout — replace __ROOT__ with its real path.
# LAN clients use the remote form instead (see client-setup.sh).
#mcpServers:
#  - name: rag
#    type: stdio
#    command: __ROOT__/.venv/bin/python
#    args: [__ROOT__/rag_mcp.py]
#    cwd: __ROOT__
